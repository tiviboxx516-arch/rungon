<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khanhwashere<3</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c451;--gold2:#ffdf8a;--ink:#e8ecf8;--bg:#0a0f1f;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--pri:#2dd4bf}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;padding-top:env(safe-area-inset-top,0px)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#side{width:330px;flex-shrink:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#121a35,#0a0f1f);border-right:1px solid var(--line);z-index:20}
.brand{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--gold),#e8912d);box-shadow:0 6px 22px rgba(245,196,81,.35)}
.brand b{display:block;font-weight:900;letter-spacing:.18em;font-size:15px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{opacity:.55;font-size:11px;letter-spacing:.12em}
.scroll{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
h3{margin:0 0 8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:13px;transition:.2s}
.opt:hover{transform:translateY(-1px);border-color:var(--gold)}
.opt.on{background:linear-gradient(135deg,rgba(245,196,81,.25),rgba(245,196,81,.08));border-color:var(--gold);color:var(--gold2)}
.th{height:40px;border-radius:12px;border:2px solid transparent;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000a;transition:.2s}
.th.on{border-color:var(--gold);transform:scale(1.05)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:700}
.row input{flex:1;accent-color:var(--gold)}
.row2{display:flex;gap:8px}
.ghost{flex:1;padding:10px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:13px}
.ghost:hover{border-color:var(--gold)}
.foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.25)}
.cta{padding:14px;border-radius:14px;font-weight:900;font-size:15px;letter-spacing:.08em;background:linear-gradient(135deg,#14b8a6,#0d9488);box-shadow:0 8px 24px rgba(20,184,166,.3);transition:.2s}
.cta.gold{background:linear-gradient(135deg,var(--gold2),#e8912d);color:#3b2400;box-shadow:0 8px 26px rgba(245,196,81,.35)}
.cta:hover{transform:translateY(-2px)}.cta:disabled{opacity:.5;transform:none}
.cnt{text-align:center;font-size:12px;opacity:.7}.cnt b{color:var(--gold)}
#stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(135deg,#111a33,#0a0f1f);transition:background .5s}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(245,196,81,.08),transparent 40%),radial-gradient(circle at 85% 90%,rgba(45,212,191,.08),transparent 45%);pointer-events:none}
#nodes{position:absolute;inset:0;z-index:10}
.card{position:absolute;width:150px;height:178px;border-radius:16px;background:linear-gradient(180deg,#fff,#eef2fb);color:#1e293b;display:flex;flex-direction:column;align-items:center;padding:12px 8px;box-shadow:0 10px 26px rgba(0,0,0,.3);transition:left 2s ease-in-out,top 2s ease-in-out,transform .3s;user-select:none;overflow:hidden;border:1px solid rgba(255,255,255,.6)}
.av{width:72px;height:72px;border-radius:50%;padding:2px;border:3px solid;margin-bottom:8px;flex-shrink:0}
.av>div{width:100%;height:100%;border-radius:50%;overflow:hidden}
.nm{font-weight:800;text-align:center;line-height:1.15;word-break:break-word;width:100%;padding:0 3px}
.mystery .av>div{filter:brightness(0) blur(3px)}.mystery .nm{filter:blur(6px)}
.scan{transform:scale(1.2)!important;z-index:50!important;transition:transform .05s!important;border-color:var(--gold)!important;animation:sp .28s ease-in-out infinite alternate}
@keyframes sp{from{box-shadow:0 0 0 6px rgba(245,196,81,.55),0 0 40px 8px rgba(245,196,81,.6)}to{box-shadow:0 0 0 9px rgba(245,196,81,.3),0 0 65px 18px rgba(245,196,81,.85)}}
.focus{z-index:100!important;animation:fc .72s ease-in-out infinite}
@keyframes fc{0%,100%{transform:scale(1.22);box-shadow:0 0 0 8px rgba(244,63,94,.4),0 0 50px rgba(244,63,94,.8)}50%{transform:scale(1.34);box-shadow:0 0 0 22px rgba(244,63,94,.08),0 0 90px #f43f5e}}
.won{transform:scale(1.14)!important;z-index:70!important;animation:none!important;box-shadow:0 0 0 5px rgba(245,196,81,.6),0 0 50px 12px rgba(245,196,81,.7)}
#ov{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .5s}
#ov.on{opacity:1}
#hint{position:absolute;top:6%;left:50%;transform:translateX(-50%);z-index:41;font-weight:900;letter-spacing:.45em;color:var(--gold2);font-size:clamp(12px,1.5vw,18px);text-shadow:0 0 24px rgba(245,196,81,.7);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1}
#nd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);z-index:40;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 48px;border-radius:30px;max-width:92%;background:linear-gradient(160deg,rgba(24,32,64,.96),rgba(10,15,31,.96));border:1px solid rgba(245,196,81,.55);box-shadow:0 0 90px rgba(245,196,81,.25),0 30px 70px rgba(0,0,0,.55);transition:opacity .5s,transform .55s cubic-bezier(.22,1.2,.36,1)}
#nd.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#nd.hot{border-color:#f43f5e;box-shadow:0 0 120px rgba(244,63,94,.5),0 30px 70px rgba(0,0,0,.55)}
#nd.beat{animation:bt .3s ease-out}
@keyframes bt{40%{transform:translate(-50%,-50%) scale(1.045)}}
#nda{width:128px;height:128px;border-radius:50%;border:4px solid var(--gold);padding:3px;background:#fff;box-shadow:0 0 0 9px rgba(245,196,81,.18),0 0 50px rgba(245,196,81,.5)}
#nda>div{width:100%;height:100%;border-radius:50%;overflow:hidden}
#ndn{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:0 22px;font-weight:900;font-size:clamp(28px,4.6vw,60px);line-height:1.1;text-align:center}
.nw{display:inline-flex;white-space:nowrap}
.nc{display:inline-block;min-width:.62em;text-align:center;margin:0 1px;color:transparent;border-bottom:5px solid rgba(255,255,255,.25);transform-origin:50% 100%}
.nc.on{color:var(--gold2);border-bottom-color:transparent;text-shadow:0 0 18px rgba(245,196,81,.6);animation:lp .5s cubic-bezier(.22,1.2,.36,1) both}
@keyframes lp{0%{transform:scale(.2,2.2) translateY(-18px);opacity:0;filter:blur(8px)}35%{transform:scale(1.6,.55);opacity:1}60%{transform:scale(.85,1.3);filter:blur(0)}100%{transform:scale(1)}}
.nw.rest{opacity:0;transform:scale(.5);filter:blur(10px)}
.nw.rest.on{opacity:1;filter:blur(0);transform:scale(1);transition:.6s cubic-bezier(.22,1.2,.36,1)}
.nw.rest .nc{animation:none}
.spk{position:absolute;pointer-events:none;z-index:80;transform:translate(-50%,-50%);animation:sf .95s ease-out forwards;text-shadow:0 0 12px rgba(245,196,81,.9)}
@keyframes sf{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4) rotate(200deg)}}
.shake{animation:sk .65s cubic-bezier(.36,.07,.19,.97)}
@keyframes sk{10%,90%{transform:translate(-4px,3px)}20%,80%{transform:translate(7px,-5px)}30%,50%,70%{transform:translate(-9px,4px)}40%,60%{transform:translate(8px,-6px)}}
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,20,.78);backdrop-filter:blur(8px)}
.modal.on{display:flex}
.box{background:linear-gradient(180deg,#18214a,#0e1430);border:1px solid rgba(245,196,81,.35);border-radius:26px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6);width:100%;max-width:440px;position:relative}
.box h2{margin:0 0 14px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);text-align:center}
textarea{width:100%;height:240px;border-radius:14px;padding:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--ink);font:600 13px Nunito,sans-serif;resize:none}
.x{position:absolute;top:12px;right:16px;background:none;font-size:20px;opacity:.6}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 20px 0}.tab{padding:7px 2px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:11px;line-height:1.25;transition:.2s}.tab span{display:block;font-size:18px}.tab.on{background:linear-gradient(135deg,var(--gold2),#e8912d);color:#3b2400;border-color:transparent}
#wpanel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:15}
#ww{position:relative;width:420px;height:420px}
.st{width:30px;height:30px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:18px;font-weight:900}.st:hover{border-color:var(--gold)}
#wlist{max-height:46vh;overflow:auto;text-align:left;margin:10px 0}.wi{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-weight:800;margin-bottom:6px}.wi i{font-style:normal;flex-shrink:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),#e8912d);color:#3b2400;font-size:13px}
#pk{position:absolute;bottom:12px;left:0;right:0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px}.chip{padding:6px 12px;border-radius:99px;background:rgba(245,196,81,.2);border:1px solid var(--gold);font-weight:800;font-size:12px;color:var(--gold2)}
body.wheel #wpanel{display:flex}body.wheel #nodes,body.wheel #hint,body.wheel #nd,body.wheel #ov,body.wheel #patsec,body.wheel #slrow{display:none}
#wc{width:100%;height:100%;filter:drop-shadow(0 20px 40px rgba(0,0,0,.55))}
#ptr{position:absolute;top:-10px;left:50%;transform:translateX(-50%);transform-origin:50% 20%;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:42px solid #fb3a5d;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));transition:transform .06s;z-index:5}
#wcard{text-align:center;max-width:380px}
#wcard .crown{font-size:42px}
#wname{font-size:26px;font-weight:900;margin:6px 0 18px;background:linear-gradient(90deg,var(--gold2),#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word}
#wav{width:112px;height:112px;margin:10px auto;border-radius:50%;border:4px solid var(--gold);padding:3px;background:#fff;overflow:hidden;box-shadow:0 0 50px rgba(245,196,81,.6)}
#wav>div{border-radius:50%;overflow:hidden;width:100%;height:100%}
.wb{display:block;width:100%;padding:13px;border-radius:14px;font-weight:800;margin-top:8px}
.wb.a{background:var(--glass);border:1px solid var(--line)}.wb.b{background:linear-gradient(135deg,#fb3a5d,#e11d48)}
@media(max-width:760px){body{flex-direction:column}#side{width:100%;height:42%}.brand{padding:10px 16px}.scroll{padding:10px 16px}}
body.race #nodes,body.race #hint,body.race #nd,body.race #ov,body.race #patsec,body.race #slrow,body.gift #nodes,body.gift #hint,body.gift #nd,body.gift #ov,body.gift #patsec,body.gift #slrow{display:none}
body.race #rpanel{display:block}body.gift #gpanel{display:grid}
#rpanel{position:absolute;inset:0;display:none;overflow:hidden;z-index:15}
#world{position:absolute;left:0;top:0;height:100%;will-change:transform;background:linear-gradient(#2f7d3a,#256b31)}
#road{position:absolute;left:0;right:0;background-color:#3a3f4d;box-shadow:0 0 0 4px #e5e7eb,0 0 0 6px #111}
.sl,.fl{position:absolute;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/12px 12px}.sl{width:12px}.fl{width:24px}
.car{position:absolute;left:0;top:0;will-change:transform}.car svg{width:100%;height:100%;display:block}
.tg{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.62);color:#fff;font-weight:800;white-space:nowrap;line-height:1.3;margin-bottom:1px}
.car.lead{z-index:30}.car.lead .tg{background:var(--gold);color:#3b2400}.car.win{z-index:40}.car.win .tg{background:var(--gold2);color:#3b2400}
.tr{position:absolute;font-style:normal;font-size:26px;line-height:1}
.sg{position:absolute;padding:3px 10px;border-radius:8px;background:#fff;color:#111;font-weight:900;font-size:12px;box-shadow:0 2px 6px #0006}
#lb{position:absolute;right:14px;top:14px;z-index:6;background:rgba(5,8,20,.72);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:180px;font-size:12px;font-weight:800;backdrop-filter:blur(6px)}
#lb h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;color:var(--gold2)}#lb div{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
#cd{position:absolute;inset:0;display:grid;place-items:center;z-index:5;font-size:clamp(60px,14vw,150px);font-weight:900;color:#fff;text-shadow:0 0 40px var(--gold),0 8px 30px #000;pointer-events:none;opacity:0}
#cd.pop{animation:cdp .8s ease-out}@keyframes cdp{0%{opacity:0;transform:scale(2.2)}30%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}
#gpanel{--gw:116px;--gh:110px;position:absolute;inset:0;display:none;grid-template-columns:repeat(auto-fill,minmax(var(--gw),1fr));gap:12px;padding:24px;align-content:safe center;overflow:auto;z-index:15}
#gpanel.dn{--gw:100px;--gh:88px;gap:10px;padding:18px}#gpanel.dd{--gw:84px;--gh:72px;gap:8px;padding:14px}
.gb{perspective:700px;height:var(--gh)}.gb.ready{cursor:pointer}.gb.ready:hover .gf{box-shadow:0 0 0 3px var(--gold),0 0 28px rgba(245,196,81,.85)}
.gi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,1.3,.4,1)}.gb.open .gi{transform:rotateY(180deg) scale(1.06)}
.gf,.gk{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.gf{font-size:calc(var(--gh)*.4);background:linear-gradient(135deg,#f43f5e,#a855f7);box-shadow:0 10px 24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35)}.gf small{font-size:11px;font-weight:900;opacity:.85}
.gk{transform:rotateY(180deg);background:linear-gradient(180deg,#fff,#eef2fb);color:#1e293b;font-size:12px;text-align:center;padding:4px;border:2px solid var(--gold);box-shadow:0 0 30px rgba(245,196,81,.7);line-height:1.15}
.gav{width:46px;height:46px;border-radius:50%;border:3px solid;overflow:hidden}#gpanel.dd .gav{display:none}#gpanel.dd .gk{font-size:10px}
#gpanel.shk .gb:not(.open) .gi{animation:gsk .15s linear infinite alternate}
#gpanel .gb.shuffling{z-index:30;animation:gboxmove .22s ease-in-out infinite alternate;filter:brightness(1.2);}
#gpanel .gb.shuffling .gi{animation:gboxshake .11s linear infinite alternate;transform:rotate(var(--rot,0deg)) scale(1.05);filter:brightness(1.18);}
#gpanel .gb.shuffling .gf{filter:brightness(1.12);}
#gpanel .gb.shuffle-return{animation:gboxreturn .58s cubic-bezier(.22,1.2,.36,1) forwards;}
@keyframes gboxmove{from{transform:translate(var(--sx,0),var(--sy,0)) rotate(-3deg) scale(.97)}to{transform:translate(calc(var(--sx,0)*-1),calc(var(--sy,0)*-1)) rotate(3deg) scale(1.04)}}
@keyframes gboxshake{from{transform:rotate(calc(var(--rot,0deg) - 5deg))}to{transform:rotate(calc(var(--rot,0deg) + 5deg))}}
@keyframes gboxreturn{0%{transform:translate(var(--sx,0),var(--sy,0)) rotate(4deg) scale(1.04)}100%{transform:translate(0,0) rotate(0) scale(1)}}
@keyframes gsk{from{transform:rotate(-6deg)}to{transform:rotate(6deg) translateY(-3px)}}
@media(max-width:760px){#lb{right:8px;top:8px;min-width:140px;padding:8px 10px}}

#teamsec,#tpanel{display:none}
body.team #teamsec{display:block}body.team #tpanel{display:grid}
body.team :is(#nodes,#hint,#nd,#ov,#patsec,#slrow){display:none}body.team #cntrow{display:none}
#tpanel{position:absolute;inset:0;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:22px;align-content:start;overflow:auto;z-index:15}
.tb{border-radius:18px;background:var(--glass);border:1px solid var(--tc);overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.3),0 0 22px color-mix(in srgb,var(--tc) 25%,transparent);display:flex;flex-direction:column;align-self:start}
.th2{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:900;color:#fff;text-shadow:0 1px 3px #0006;background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 50%,#000))}
.th2 b{flex:1;font-size:14px}.th2 span{background:rgba(0,0,0,.28);padding:2px 10px;border-radius:99px;font-size:12px}
.tm{padding:8px;display:flex;flex-direction:column;gap:5px}.ph{opacity:.4;font-size:12px;text-align:center;padding:12px;font-weight:700}
.mb{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:700;font-size:13px;animation:mbin .45s cubic-bezier(.22,1.3,.36,1)}
.mb i{width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid}
@keyframes mbin{from{opacity:0;transform:translateY(-16px) scale(.6)}}
.sc{position:relative;height:var(--gh);border-radius:16px;overflow:hidden;color:#1e293b;border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 24px rgba(0,0,0,.35);background:#fff}
.su{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;font-size:12px;font-weight:800;line-height:1.1;padding:4px;background:linear-gradient(180deg,#fff,#eef2fb)}
.su em{font-style:normal;font-size:9px;font-weight:900;opacity:.55}.sc.w .su{background:linear-gradient(180deg,#fff8dc,#ffd978)}.sc.w .su em{color:#b45309;opacity:1}
.sav{width:42px;height:42px;border-radius:50%;border:3px solid;overflow:hidden}#gpanel.dd .sav{display:none}
.sc canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .5s}
.sc.open.w{box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(245,196,81,.95);animation:wpop .6s}.sc.zap{animation:gsk .1s linear 3 alternate}
@keyframes wpop{40%{transform:scale(1.14)}}
.tk{width:min(660px,100%);padding:16px;border-radius:28px;background:linear-gradient(150deg,#fff3c4,#f5c451 55%,#e8912d);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 60px rgba(245,196,81,.35);color:#3b2400;border:2px solid #fff8}
.tkh{text-align:center;font-weight:900;letter-spacing:.14em;font-size:clamp(14px,2.2vw,20px);margin-bottom:10px}.tkh small{display:block;letter-spacing:.04em;font-size:12px;opacity:.75;margin-top:2px}
.tkg{position:relative;display:grid;gap:6px;padding:8px;border-radius:18px;background:rgba(255,255,255,.4);grid-auto-rows:var(--ch,84px)}
.tc{border-radius:12px;background:#fff;color:#1e293b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;line-height:1.1;text-align:center;padding:3px;overflow:hidden;transition:.3s}
.tcav{width:36px;height:36px;border-radius:50%;border:3px solid;overflow:hidden;flex-shrink:0}
.tc.hit{background:linear-gradient(180deg,#fff8dc,#ffd978);box-shadow:0 0 0 3px #f43f5e,0 0 24px rgba(244,63,94,.8);animation:wpop .6s;z-index:2}
.tkg canvas{position:absolute;left:0;top:0;touch-action:none;cursor:crosshair;transition:opacity .7s;border-radius:18px}
.tk{display:flex;flex-direction:column;flex-shrink:0}.tkh{flex-shrink:0}.tkg{flex:1;min-height:0}
.tc{font-size:11px;gap:2px}.tc b{font-size:11px;word-break:break-word}.tcav{width:46%;max-width:38px;height:auto;aspect-ratio:1}
</style>

<body>
<aside id="side">
 <div class="brand"><div class="logo">🎯</div><div><b>Tự động gọi hs</b><small>By La Minh Khánh 10A8 HBOER</small></div></div>
 <div class="tabs" id="tabs"></div>
 <div class="scroll">
  <div id="patsec"><h3>Kiểu bay</h3><div class="g2" id="pats"></div></div>
  <div id="teamsec"><h3>Chọn team tham gia</h3><div class="g2" id="tchips"></div><div class="row2" style="margin-top:8px"><button class="ghost" onclick="toggleTeamEdit()">✏️ Sửa DS team</button><button class="ghost" onclick="copyTeams()">📋 Copy KQ</button></div><div class="cnt" id="tinfo" style="margin-top:8px"></div></div>
  <div><h3>Nền sân khấu</h3><div class="g3" id="themes"></div></div>
  <div class="row" id="cntrow"><span style="flex:1">Số học sinh gọi</span><button class="st" onclick="stp(-1)">−</button><b id="cn" style="min-width:20px;text-align:center;font-size:16px;color:var(--gold2)">1</b><button class="st" onclick="stp(1)">+</button></div>
  <div class="row" id="slrow"><span>Quét nhanh</span><input type="range" id="sl" min="3" max="15" value="5" oninput="sv.textContent=this.value"><b id="sv">5</b>s</div>
  <div class="row2"><button class="ghost" onclick="toggleSetup()">✏️ Sửa DS</button><button class="ghost" onclick="resetList()">↺ Đặt lại</button></div>
 </div>
 <div class="foot">
  <button id="start" class="cta" onclick="startCalling()">▶ BẮT ĐẦU GỌI</button>
  <div class="cnt">Đang có mặt: <b id="cnt">0</b></div>
 </div>
</aside>
<main id="stage"><div id="ov"></div><div id="nodes"></div><div id="wpanel"><div id="ww"><div id="ptr"></div><canvas id="wc" width="1000" height="1000"></canvas></div><div id="pk"></div></div><div id="rpanel"></div><div id="gpanel"></div><div id="tpanel"></div><div id="hint">ĐANG GỌI TÊN...</div><div id="nd"><div id="nda"></div><div id="ndn"></div></div></main>

<div class="modal" id="sm"><div class="box"><button class="x" onclick="toggleSetup()">✕</button><h2>Danh sách học sinh</h2><textarea id="list"></textarea><div class="row2" style="margin-top:12px"><button class="ghost" onclick="toggleSetup()">Hủy</button><button class="ghost" style="background:var(--pri);color:#04201c" onclick="applyList()">Lưu danh sách</button></div></div></div>


<div class="modal" id="tmod"><div class="box"><button class="x" onclick="toggleTeamEdit()">✕</button><h2>Danh sách team</h2><textarea id="tlist" style="height:200px" placeholder="Mỗi dòng 1 team"></textarea><div class="row2" style="margin-top:12px"><button class="ghost" onclick="toggleTeamEdit()">Hủy</button><button class="ghost" style="background:var(--pri);color:#04201c" onclick="applyTeams()">Lưu team</button></div></div></div>
<div class="modal" id="wn" style="z-index:300"><div class="box" id="wcard"><div class="crown">👑</div><h2 id="wh" style="margin:4px 0 0">Bạn được chọn là</h2><div id="wav"></div><div id="wname"></div><div id="wlist"></div><button class="wb a" onclick="closeModal(false)">Giữ lại trong danh sách</button><button class="wb b" onclick="closeModal(true)">Xóa khỏi danh sách</button></div></div>

<script>
const CW=150,CH=178,PAD=10;
const DEF="Nguyễn Vũ Hoài An\nPHẠM BẢO AN\nĐOÀN ĐỨC ANH\nNGUYỄN NGỌC ÁNH\nPhạm Trần Chí Bảo\nPHAN NGỌC BÍCH\nNGUYỄN HOÀNG ĐẠT\nHà Minh Đức\nPHẠM MINH ĐỨC\nNGUYỄN ĐỨC GIANG\nTỐNG ĐỨC GIANG\nNguyễn Thị Minh Hà\nNguyễn Đặng Bảo Hân\nNGUYỄN ĐÌNH HIẾU\nNGUYỄN HẢI HÒA\nĐỖ DUY HOÀNG\nNGUYỄN HỮU MINH HOÀNG\nBÙI THỊ ÁNH HỒNG\nHOÀNG PHI HÙNG\nTrương Khánh Huy\nBÙI THỊ THANH HUYỀN\nCÁI HOÀNG TRÙNG KHÁNH\nĐINH XUÂN KHÁNH\nLA MINH KHÁNH\nPhạm Ngọc Khánh\nÂU THỊ MINH LUYẾN\nNguyễn Mậu Minh\nPhạm Nguyễn Lâm Minh\nVŨ HOÀNG MỸ MỸ\nHOÀNG DƯƠNG BẢO NGỌC\nCHU VĂN NHÂN\nVŨ PHAN YẾN NHI\nĐOÀN ĐỨC PHONG\nNGUYỄN QUỐC PHONG\nBÙI THỊ MAI PHƯƠNG\nLÊ CÔNG QUÂN\nPhú Mạnh Quân\nĐẶNG MAI TRANG\nTRẦN HUYỀN TRANG\nBÙI VĂN QUỐC TRUNG\nNGUYỄN TIẾN TRUNG\nTRẦN TUẤN TÚ\nNGUYỄN HOÀNG VIỆT\nBÙI HUY VŨ\nTẠ HIỀN VY";
const PATS=[['chaos','🌀','Hỗn loạn'],['spiral','🐚','Xoắn ốc'],['fire','🔥','Đốt lửa'],['wave','🌊','Sóng'],['planet','🪐','Hành tinh'],['figure8','♾️','Số 8'],['pendulum','⏱️','Con lắc'],['bubble','🫧','Bong bóng'],['heart','❤️','Trái tim'],['zigzag','⚡','Zigzag']];
const THEMES=[['Mặc định','linear-gradient(135deg,#111a33,#0a0f1f)'],['Cực quang','linear-gradient(135deg,#ec4899,#8b5cf6)'],['Xoáy tím','linear-gradient(135deg,#3b82f6,#6366f1)'],['Lửa đêm','linear-gradient(135deg,#2a1a1a,#000)'],['Sóng tím','linear-gradient(135deg,#a855f7,#ec4899)'],['Đại dương','linear-gradient(135deg,#0f766e,#06b6d4)']];
let all=[],avail=[],nodes=[],calling=false,pat='chaos',chaosT=null,snd=true;
const $=id=>document.getElementById(id),stage=$('stage'),ov=$('ov'),nd=$('nd');
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

// ===== UI =====
PATS.forEach(([k,e,l],i)=>{const b=document.createElement('button');b.className='opt'+(i?'':' on');b.innerHTML=`<span>${e}</span>${l}`;b.onclick=()=>{pat=k;document.querySelectorAll('#pats .opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(k!=='chaos'&&chaosT){clearInterval(chaosT);chaosT=null}else if(k==='chaos'&&!chaosT)startChaos();moveAll()};$('pats').appendChild(b)});
THEMES.forEach(([l,bg],i)=>{const b=document.createElement('button');b.className='th'+(i?'':' on');b.style.background=bg;b.textContent=l;b.onclick=()=>{stage.style.background=bg;document.querySelectorAll('.th').forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('themes').appendChild(b)});

// ===== ÂM THANH =====
let au=false,S={};
function initAudio(){if(au)return;const m=(o,v)=>{o.toDestination();o.volume.value=v;return o};
S.tick=m(new Tone.Synth({oscillator:{type:'square'},envelope:{attack:.01,decay:.05,sustain:0,release:.05}}),-12);
S.sus=m(new Tone.Synth({oscillator:{type:'sawtooth'},envelope:{attack:.02,decay:.1,sustain:.3,release:.4}}),-8);
S.win=m(new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:.05,decay:.2,sustain:.5,release:1.5}}),-5);
S.heart=m(new Tone.MembraneSynth({pitchDecay:.05,octaves:4}),-2);
S.drum=m(new Tone.MembraneSynth({pitchDecay:.02,octaves:2}),-10);au=true}
const ok=()=>snd&&au;

// Tone.js có thể ném:
// "Start time must be strictly greater than previous start time"
// nếu nhiều trigger xảy ra trong cùng một timestamp.
// Luôn đẩy timestamp kế tiếp vượt timestamp trước một khoảng nhỏ.
let audioNextTime=0;
function safeTone(fn){
  if(!ok())return;
  try{fn()}catch(e){console.warn('Tone audio skipped:',e)}
}
const tick=(n='E5')=>safeTone(()=>{
  const now=Tone.now();
  const t=Math.max(now,audioNextTime+0.014);
  audioNextTime=t;
  S.tick.triggerAttackRelease(n,'32n',t);
});
const susS=()=>safeTone(()=>{
  const now=Tone.now();
  const t=Math.max(now,audioNextTime+0.014);
  audioNextTime=t;
  S.sus.triggerAttackRelease('A3','16n',t);
});
const winS=()=>safeTone(()=>{
  const now=Tone.now();
  const t=Math.max(now,audioNextTime+0.02);
  audioNextTime=t;
  S.win.triggerAttackRelease(['C4','E4','G4','C5'],'2n',t);
});
const drum=()=>safeTone(()=>{
  const now=Tone.now();
  const t=Math.max(now,audioNextTime+0.014);
  audioNextTime=t;
  S.drum.triggerAttackRelease('G1','32n',t);
});
function heart(){safeTone(()=>{
  const now=Tone.now();
  const t1=Math.max(now,audioNextTime+0.014);
  const t2=t1+0.17;
  audioNextTime=t2;
  S.heart.triggerAttackRelease('C1','8n',t1);
  S.heart.triggerAttackRelease('A0','8n',t2);
})}

// ===== AVATAR =====
function nameSize(n){const l=n.trim().length;return l<=14?13:l<=20?12:l<=26?11:l<=34?10:l<=44?9:8}
function avatar(name){const bg=['#c4b5fd','#bae6fd','#fecdd3','#bbf7d0','#fde68a','#99f6e4'],sh=['#8b5cf6','#0ea5e9','#e11d48','#16a34a','#d97706','#0d9488'];
let h=0;for(let i=0;i<name.length;i++)h+=name.charCodeAt(i);const i=h%6,g=h%2===0;
return{c:sh[i],html:`<svg viewBox="0 0 100 100" width="100%" height="100%" style="background:${bg[i]}"><path d="M20 100C20 65 80 65 80 100Z" fill="${sh[(h+1)%6]}"/><circle cx="50" cy="45" r="28" fill="#fcd34d"/><path d="M22 45C22 10 78 10 78 45C78 30 22 30 22 45" fill="#1e293b"/><circle cx="38" cy="40" r="3.5" fill="#1e293b"/><circle cx="62" cy="40" r="3.5" fill="#1e293b"/><path d="M40 55Q50 62 60 55" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>${g?'<circle cx="38" cy="40" r="10" stroke="#475569" stroke-width="2" fill="none"/><circle cx="62" cy="40" r="10" stroke="#475569" stroke-width="2" fill="none"/><line x1="48" y1="40" x2="52" y2="40" stroke="#475569" stroke-width="2"/>':''}</svg>`}}

// ===== DANH SÁCH =====
function toggleSetup(){const m=$('sm');if(!m.classList.contains('on'))$('list').value=all.join('\n');m.classList.toggle('on')}
function resetList(){if(confirm('Khôi phục danh sách ban đầu?')){$('list').value=DEF;parseList()}}
function applyList(){parseList();$('sm').classList.remove('on')}
function parseList(){all=$('list').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!all.length)return alert('Vui lòng nhập ít nhất 1 tên.');avail=[...all];updCount();renderNodes();refreshMode()}
let cnt=1,picked=[];const wl=()=>avail.filter(n=>!picked.includes(n));
function stp(d){if(calling||wSpin)return;cnt=Math.max(1,Math.min(10,avail.length||1,cnt+d));$('cn').textContent=cnt;refreshMode()}
function updCount(){$('cnt').textContent=`${avail.length} / ${all.length}`;cnt=Math.max(1,Math.min(cnt,avail.length||1));$('cn').textContent=cnt}
function renderNodes(){$('nodes').innerHTML='';nodes=[];
avail.forEach(name=>{const el=document.createElement('div');el.className='card';const a=avatar(name);
el.innerHTML=`<div class="av" style="border-color:${a.c}"><div>${a.html}</div></div><div class="nm" style="font-size:${nameSize(name)}px">${name}</div>`;
el.style.left=PAD+Math.random()*Math.max(0,stage.clientWidth-CW-PAD*2)+'px';el.style.top=PAD+Math.random()*Math.max(0,stage.clientHeight-CH-PAD*2)+'px';
$('nodes').appendChild(el);nodes.push({el,name})});moveAll()}

// ===== KIỂU BAY =====
function pos(i,n,t){const w=stage.clientWidth,h=stage.clientHeight,cx=w/2-CW/2,cy=h/2-CH/2;let x=cx,y=cy;
switch(pat){
case'spiral':{const a=i*.8+t*.0005,r=50+i*10;x=cx+Math.cos(a)*r;y=cy+Math.sin(a)*r;break}
case'wave':x=w/(n+1)*(i+1)-CW/2;y=cy+Math.sin(x*.01+t*.002)*120;break;
case'planet':{const a=i/n*Math.PI*2+t*.001;x=cx+Math.cos(a)*w*.35;y=cy+Math.sin(a)*h*.35;break}
case'heart':{const a=i/n*Math.PI*2+t*.001,s=Math.min(w,h)*.015;x=cx+16*Math.pow(Math.sin(a),3)*s;y=cy-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*s;break}
case'zigzag':x=w/6*(i%5+1)-CW/2+Math.sin(t*.002+Math.floor(i/5))*40;y=h/4+Math.floor(i/5)*100;break;
case'fire':{const a=i+t*.002;x=cx+Math.cos(a)*(Math.random()*40+40);y=cy+Math.sin(a)*150-(t%2000)/10;if(y<-CH)y=h;break}
case'figure8':{const a=i/n*Math.PI*2+t*.001,r=w*.25,d=Math.pow(Math.sin(a),2)+1;x=cx+r*Math.SQRT2*Math.cos(a)/d;y=cy+r*Math.SQRT2*Math.cos(a)*Math.sin(a)/d;break}
case'pendulum':{const a=Math.sin(t*.002+i*.5)*Math.PI/3;x=cx+Math.sin(a)*h*.5;y=50+Math.cos(a)*h*.5;break}
case'bubble':x=cx+Math.sin(t*.001+i)*w/3;y=cy+Math.cos(t*.0013+i*2)*h/3;break}
return{x:Math.max(PAD,Math.min(x,w-CW-PAD)),y:Math.max(PAD,Math.min(y,h-CH-PAD))}}
function loop(t){if(!calling&&pat!=='chaos')nodes.forEach((n,i)=>{const p=pos(i,nodes.length,t);n.el.style.transition='none';n.el.style.left=p.x+'px';n.el.style.top=p.y+'px'});requestAnimationFrame(loop)}
function moveAll(){if(pat!=='chaos')return;const mx=Math.max(0,stage.clientWidth-CW-PAD*2),my=Math.max(0,stage.clientHeight-CH-PAD*2);
nodes.forEach(n=>{if(!n.el.classList.contains('scan')&&!n.el.classList.contains('focus')){n.el.style.transition='left 2s ease-in-out,top 2s ease-in-out,transform .3s';n.el.style.left=PAD+Math.random()*mx+'px';n.el.style.top=PAD+Math.random()*my+'px'}})}
function startChaos(){clearInterval(chaosT);chaosT=setInterval(()=>{if(!calling&&pat==='chaos')moveAll()},2000)}

// ===== HIỆU ỨNG =====
function sparkle(el,n=10,spread=220,box){const s=stage.getBoundingClientRect(),b=(box||el).getBoundingClientRect(),cx=b.left-s.left+b.width/2,cy=b.top-s.top+b.height/2,ic=['✨','⭐','💫','✦','🌟'];
for(let i=0;i<n;i++){const d=document.createElement('div');d.className='spk';d.textContent=ic[Math.random()*ic.length|0];d.style.cssText+=`left:${cx}px;top:${cy}px;font-size:${16+Math.random()*16}px;--dx:${(Math.random()-.5)*spread}px;--dy:${(Math.random()-.5)*spread}px`;stage.appendChild(d);setTimeout(()=>d.remove(),1000)}}
function shake(){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),650)}
function spot(el,r){const s=stage.getBoundingClientRect(),b=el.getBoundingClientRect(),hot=nd.classList.contains('hot');
ov.style.background=`radial-gradient(circle at ${b.left-s.left+b.width/2}px ${b.top-s.top+b.height/2}px,transparent ${r}px,${hot?'rgba(30,0,0,.72)':'rgba(3,5,15,.72)'} ${r+420}px)`}
function freeze(){const s=stage.getBoundingClientRect();nodes.forEach(n=>{const r=n.el.getBoundingClientRect();n.el.classList.remove('scan');n.el.style.transition='none';n.el.style.left=r.left-s.left-(r.width-CW)/2+'px';n.el.style.top=r.top-s.top-(r.height-CH)/2+'px'})}
async function beat(){heart();nd.classList.remove('beat');void nd.offsetWidth;nd.classList.add('beat');vib(18);await sleep(115)}

// ===== PHA CUỐI =====
async function roulette(t,n,pool=nodes){let p=null;
for(let i=0;i<n;i++){let k=t;if(i<n-1){do{k=pool[Math.random()*pool.length|0]}while(pool.length>1&&(k===p||k===t))}
p&&p.el.classList.remove('scan');p=k;k.el.classList.add('scan');tick(['C5','D5','E5','G5','A5','C6'][Math.min(5,i/n*6|0)]);await sleep(55+Math.pow(i/n,3.2)*600)}
await sleep(120);p&&p.el.classList.remove('scan');t.el.classList.add('focus');vib([30,40,30]);await sleep(520)}
async function reveal(w){const words=w.name.normalize('NFC').trim().split(/\s+/),box=$('ndn'),given=[],rest=[],els=[];box.innerHTML='';
words.forEach((x,i)=>{const last=i===words.length-1,s=document.createElement('span');s.className='nw'+(last?'':' rest');
[...x].forEach(c=>{const l=document.createElement('span');l.className='nc';l.textContent=c;s.appendChild(l);(last?given:rest).push(l)});box.appendChild(s);els.push(s)});
const a=avatar(w.name);$('nda').style.borderColor=a.c;$('nda').innerHTML=`<div>${a.html}</div>`;
nd.classList.remove('hot');spot(w.el,150);ov.classList.add('on');await sleep(120);nd.classList.add('show');$('hint').classList.add('on');susS();await sleep(480);
for(let i=0;i<3;i++){await beat();await sleep(400-i*75)}
const n=given.length,base=Math.max(140,Math.min(520,5000/n-200)),notes=['C4','D4','E4','G4','A4','C5','D5','E5','G5','A5','C6'];
for(let i=n-1;i>=0;i--){
if(i===0&&n>1){nd.classList.add('hot');$('nda').style.borderColor='#f43f5e';spot(w.el,150);susS();for(let s=0;s<6;s++){drum();await sleep(130)}}
await beat();given[i].classList.add('on');tick(notes[Math.min(10,(n-1-i)/n*11|0)]);sparkle(given[i],8);
await sleep(base+(i<3?[450,750,1150][i]:0))}
await sleep(360);rest.forEach(l=>l.classList.add('on'));els.forEach(e=>e.classList.add('on'));
winS();shake();vib([40,30,80,30,120]);sparkle($('ndn'),26,520);
confetti({particleCount:130,spread:78,origin:{y:.42},startVelocity:45});
setTimeout(()=>confetti({particleCount:80,spread:120,origin:{y:.5},startVelocity:55,colors:['#fbbf24','#f43f5e','#a855f7','#22d3ee']}),220);
$('hint').classList.remove('on');await sleep(1400)}
async function finalPhase(done){if(!done.length)freeze();const pool=nodes.filter(n=>!done.includes(n)),w=pool[Math.random()*pool.length|0];
nodes.forEach(n=>{if(!done.includes(n))n.el.classList.add('mystery')});
await roulette(w,10+Math.round(Math.random()*8),pool);
await reveal(w);
w.el.classList.remove('mystery','focus');w.el.classList.add('won');sparkle(w.el,14);await sleep(420);
nd.classList.remove('show');await sleep(600);ov.classList.remove('on');await sleep(400);return w}
const fastScan=(ms,pool)=>new Promise(res=>{const t0=performance.now();let last=null;(function sc(){last&&last.classList.remove('scan');const el=pool[Math.random()*pool.length|0].el;el.classList.add('scan');last=el;tick();const e=performance.now()-t0;if(e<ms)setTimeout(sc,Math.max(30,115-e/ms*88));else{last.classList.remove('scan');res()}})()});
async function startCalling(){if(!avail.length)return alert('Đã hết học sinh!');if(mode==='wheel')return spinWheel();if(mode==='team')return startTeam();if(isRace())return startRace();if(mode==='gift')return startGift();await Tone.start();initAudio();snd=true;calling=true;
const b=$('start');b.disabled=true;const K=Math.min(cnt,avail.length),done=[],fast=(+$('sl').value||5)*550;
for(let r=0;r<K;r++){b.textContent=`⏳ ĐANG TÌM ${r+1}/${K}...`;await fastScan(r?1300:fast,nodes.filter(n=>!done.includes(n)));done.push(await finalPhase(done))}
announce(done.map(n=>n.name))}

// ===== NGƯỜI TRÚNG =====
function announce(names){window.winners=names;vib([60,40,100,40,180]);
confetti({particleCount:200,spread:95,origin:{y:.6},zIndex:500});
setTimeout(()=>confetti({particleCount:120,angle:60,spread:70,origin:{x:0,y:.7},colors:['#fbbf24','#f43f5e','#a855f7'],zIndex:500}),250);
setTimeout(()=>confetti({particleCount:120,angle:120,spread:70,origin:{x:1,y:.7},colors:['#22d3ee','#34d399','#fbbf24'],zIndex:500}),400);
const one=names.length===1;$('wh').textContent=one?'Bạn được chọn là':`${names.length} bạn được chọn`;
if(one){const a=avatar(names[0]);$('wav').style.display='';$('wav').style.borderColor=a.c;$('wav').innerHTML=`<div>${a.html}</div>`;$('wname').textContent=names[0];$('wlist').innerHTML=''}
else{$('wav').style.display='none';$('wname').textContent='';$('wlist').innerHTML=names.map((n,i)=>`<div class="wi"><i>${i+1}</i>${n}</div>`).join('')}
$('wn').classList.add('on')}
function closeModal(rm){if(rm&&window.winners)avail=avail.filter(n=>!window.winners.includes(n));picked=[];$('pk').innerHTML='';

async function startRace(){
  if(racing||!race)return;

  // ĐUA XE CỐ TÌNH KHÔNG PHÁT ÂM THANH.
  // Âm thanh của các chế độ khác vẫn giữ nguyên.

  calling=true;
  prepRace();
  racing=true;

  const b=$('start');
  b.disabled=true;
  b.textContent='⏳ ĐANG ĐUA...';

  const cd=$('cd');
  for(const c of['3','2','1','GO!']){
    cd.textContent=c;
    cd.className='';
    void cd.offsetWidth;
    cd.className='pop';
    // Countdown cũng im lặng; chỉ còn rung nếu thiết bị hỗ trợ.
    vib(c==='GO!'?60:20)
    await sleep(c==='GO!'?500:800);
  }

  const R=race,K=Math.min(cnt,avail.length),fin=[],world=$('world'),lb=$('lb');
  let last=performance.now(),endAt=0,lbT=0,cam=R.cam,lead=null;

  // Các cú troll có chủ đích:
  // 1) Khi cuộc đua đã gần cuối, một xe đang bị tụt có thể được "nitro".
  // 2) Nitro đủ mạnh để nó thực sự có cơ hội cướp TOP 1.
  // 3) Chỉ xảy ra vài lần tối đa để vẫn bất ngờ, không phá cuộc đua.
  let trollUsed=0;
  let nextTrollAt=performance.now()+3500;

  await new Promise(res=>{
    (function f(now){
      const dt=Math.min(.05,Math.max(0,(now-last)/1000));
      last=now;

      let mx=-1e9,ld=null;

      try{
        R.cars.forEach(c=>{
          if(!c.done){
            c.t-=dt;

            // Nitro đang chạy
            if(c.boostUntil>now){
              c.v=5.2;
              c.t=.18;
            }else if(c.t<=0){
              c.v=Math.random()<.08?2.1:.55+Math.random()*1.1;
              c.t=.4+Math.random()*.7;
            }

            c.p=Math.min(1,c.p+c.v*.062*dt);
            c.x=c.sx+c.p*(R.FIN-c.sx);

            if(c.p>=1){
              c.done=true;
              fin.push(c);

              const r=fin.length;
              if(r<=K){
                c.tg.textContent=(['🥇','🥈','🥉'][r-1]||r+'.')+' '+short(c.nm);
                c.el.classList.add('win');
                sparkle(c.el,6);

                if(r===K)endAt=now+1300;
              }
            }
          }else{
            c.x=Math.min(c.stop,c.x+220*dt);
          }

          c.el.style.transform=`translate(${c.x}px,${c.y}px)`;

          if(c.x>mx){
            mx=c.x;
            ld=c;
          }
        });

        // ===== TROLL OVERTAKE =====
        // Kích hoạt khi leader đã đi khá xa (>72%) nhưng chưa cán đích.
        if(
          trollUsed<2 &&
          now>=nextTrollAt &&
          fin.length<K &&
          ld &&
          ld.p>=.72 &&
          ld.p<=.93
        ){
          const candidates=R.cars
            .filter(c=>!c.done && c!==ld && !c.boostUsed)
            .sort((a,b)=>a.p-b.p);

          if(candidates.length){
            // Chọn một người đang ở giữa/cuối để cú vượt nhìn rõ hơn.
            const idx=Math.min(
              candidates.length-1,
              Math.max(0,Math.floor(candidates.length*.65))
            );
            const troll=candidates[idx];

            troll.boostUsed=true;
            troll.boostUntil=now+1700;
            troll.tg.textContent='🚀 TROLL! '+short(troll.nm);
            troll.el.style.filter='drop-shadow(0 0 10px #f5c451)';
            troll.el.style.zIndex='80';

            trollUsed++;

            // Tạo khoảng tăng tốc ban đầu để người xem thấy xe "vọt" lên.
            troll.p=Math.min(0.96,troll.p+0.055);
            troll.x=troll.sx+troll.p*(R.FIN-troll.sx);

            // Không phát âm thanh trong lúc đua.
            setTimeout(()=>sparkle(troll.el,18,280),20);

            // Thông báo troll ngay trên bảng.
            const old=lb.innerHTML;
            lb.innerHTML='<h4>⚠️ TROLL OVERTAKE!</h4><div>🚀 '+esc(short(troll.nm))+' ĐANG VƯỢT!</div>';
            setTimeout(()=>{
              if(lb)lb.innerHTML=old;
            },1200);

            vib([25,20,50]);
          }

          // Lần tiếp theo chỉ có thể xảy ra sau một khoảng ngẫu nhiên.
          nextTrollAt=now+3200+Math.random()*2800;
        }

        // Khi nitro hết thì trả xe về vận tốc bình thường.
        R.cars.forEach(c=>{
          if(c.boostUntil && c.boostUntil<=now && !c.done){
            c.boostUntil=0;
            c.el.style.filter='';
            c.el.style.zIndex='';
            c.tg.textContent=short(c.nm);
          }
        });

        if(ld!==lead){
          lead&&lead.el.classList.remove('lead');
          if(ld){
            ld.el.classList.add('lead');
            lead=ld;
          }
        }

        const tgt=Math.max(0,Math.min(R.W-R.VW,mx-R.VW*.62));
        cam+=(tgt-cam)*Math.min(1,dt*3.5);
        world.style.transform=`translateX(${-cam}px)`;

        lbT-=dt;
        if(lbT<=0){
          lbT=.15;

          // Xếp hạng thật theo vị trí, thay vì ghép fin + xe chưa về.
          const ranking=[...R.cars]
            .sort((a,b)=>{
              if(a.done!==b.done)return a.done?-1:1;
              if(a.done&&b.done){
                return fin.indexOf(a)-fin.indexOf(b);
              }
              return b.x-a.x;
            })
            .slice(0,5);

          lb.innerHTML='<h4>🏁 TOP 5 · '+R.cars.length+' XE</h4>'+
            ranking.map((c,i)=>{
              const medal=['🥇','🥈','🥉'][i]||(i+1)+'.';
              return `<div>${medal} ${esc(short(c.nm))}</div>`;
            }).join('');
        }

        // ĐUA XE IM LẶNG: không gọi Tone trong animation loop.

        if((endAt&&now>=endAt)||fin.length===R.cars.length){
          res();
        }else{
          requestAnimationFrame(f);
        }

      }catch(err){
        // Quan trọng: lỗi ngoài dự kiến trong một frame không được làm cuộc đua "đứng hình".
        console.error('Race frame recovered:',err);
        if(fin.length===R.cars.length){
          res();
        }else{
          requestAnimationFrame(f);
        }
      }
    })(performance.now());
  });

  winS();
  vib([40,30,80]);
  confetti({particleCount:140,spread:90,origin:{y:.5},zIndex:500});
  await sleep(900);

  racing=false;
  announce(fin.slice(0,K).map(c=>c.nm));
}

function toggleTeamEdit(){const m=$('tmod');if(!m.classList.contains('on'))$('tlist').value=TEAMS.map(t=>t.n).join('\n');m.classList.toggle('on')}
function applyTeams(){if(tbusy)return;const L=[...new Set($('tlist').value.split('\n').map(x=>x.trim()).filter(Boolean))];if(!L.length)return alert('Nhập ít nhất 1 team.');
const old=Object.fromEntries(TEAMS.map(t=>[t.n,t.on]));TEAMS=L.map(n=>({n,on:old[n]!==false}));$('tmod').classList.remove('on');renderTeamChips();prepTeam()}
const selTeams=()=>TEAMS.map((t,i)=>({...t,c:tcol(i)})).filter(t=>t.on);
function prepTeam(){if(tbusy)return;tres=null;const sel=selTeams(),k=sel.length;
$('tinfo').innerHTML=k?`<b>${k}</b> team · khoảng <b>${Math.ceil(avail.length/k)}</b> bạn/team`:'Chưa chọn team nào';
$('tpanel').innerHTML=k?sel.map(t=>`<div class="tb" style="--tc:${t.c}"><div class="th2"><span style="background:none;padding:0;font-size:20px">👥</span><b>${esc(t.n)}</b><span>0</span></div><div class="tm"><div class="ph">Chờ chia...</div></div></div>`).join(''):'<div class="ph" style="grid-column:1/-1;padding:60px">Chọn ít nhất 1 team ở thanh bên 👈</div>'}
async function startTeam(){if(tbusy)return;const sel=selTeams(),k=sel.length;if(!k)return alert('Hãy chọn ít nhất 1 team.');
try{await Tone.start();initAudio();snd=true}catch(e){}
prepTeam();tbusy=true;const b=$('start');b.disabled=true;b.textContent='⏳ ĐANG CHIA...';
const bx=[...$('tpanel').children],ord=[...avail].sort(()=>Math.random()-.5),idx=sel.map((_,i)=>i).sort(()=>Math.random()-.5),res=sel.map(()=>[]),d=Math.max(35,Math.min(260,5000/ord.length));
bx.forEach(x=>x.querySelector('.tm').innerHTML='');susS();await sleep(500);
for(let i=0;i<ord.length;i++){const t=idx[i%k],a=avatar(ord[i]),m=document.createElement('div');res[t].push(ord[i]);m.className='mb';m.innerHTML=`<i style="border-color:${a.c}">${a.html}</i>${esc(ord[i])}`;
bx[t].querySelector('.tm').appendChild(m);bx[t].querySelector('.th2 span:last-child').textContent=res[t].length;bx[t].scrollIntoView({block:'nearest',behavior:'smooth'});tick(['C5','E5','G5','A5'][t%4]);sparkle(m,3,120);await sleep(d)}
tres=sel.map((t,i)=>({t,m:res[i]}));winS();vib([40,30,80]);confetti({particleCount:150,spread:90,origin:{y:.5},zIndex:500});
tbusy=false;b.disabled=false;b.textContent='🔄 CHIA LẠI'}
function copyTeams(){if(!tres)return alert('Chưa chia team.');const t=tres.map(({t,m})=>`${t.n} (${m.length}):\n`+m.map(x=>'• '+x).join('\n')).join('\n\n');
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Đã copy kết quả!')).catch(()=>prompt('Copy thủ công:',t))}
window.onload=()=>{renderTeamChips();$('list').value=DEF;parseList();addEventListener('resize',()=>{if(!calling)moveAll();if(mode==='wheel')layoutWheel();else if(mode==='car'&&!racing)prepRace()});startChaos();requestAnimationFrame(loop)};
</script>
</body>
